<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Flipping</title>
    <style>
       #container{
        display:flex;
        background-color:#A50000;
        width:100%;
        height:97vh;
        flex-direction:row;
        justify-content:center;
        align-items:center;
       }

       #card{
        width:200px;
        height:300px;
        background-color:whitesmoke;
        border-radius:5px;
        box-shadow:5px 5px black;
        transition:transform 2s; /* This Property makes the card apply same transform property
        again while getting back(transitioning back) to its original state, which was used to transform it when hovered*/
        background-image:url("./Pokemon.jpg");
        background-position:center;
        background-size:cover;
       }

       #card:hover{
         transition-duration: 2s;
         transform:rotateY(180deg);
         transition-timing-function:ease-in-out;
         border-radius:5px;
         background-image:url("./Misti.jpg");
       }


       
    </style>
</head>
<body>
    <div id="container">
        <div id="card"></div>
    </div>
</body>
</html>
