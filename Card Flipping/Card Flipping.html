<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Flipping</title>
    <style>
       #container{
        width:100%;
        height:97vh;
        display:flex;
        justify-content: center;
        align-items: center;
        background-color:#A50000;
       }

       #card-frame{
        width:210px;
        height:300px;
        border-radius:5px;
        position:relative;
        background-color:#A50000;
        border-radius:5px;
       }

       #main-card{
        border-radius:5px;
        width:100%;
        height:100%;
        position:relative;
        transform-style:preserve-3d;
        transition:transform 1s;
        will-change:transform;
       }

       #card-frame:hover #main-card{
         transform:rotateY(180deg);
       }

       .card-face{
        position:absolute;
        width:100%;
        height:100%;
        overflow:hidden; 
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
       }

       .card-face img{
        border-radius: 5px;
        width:100%;
        height:100%;
        object-fit:cover;
       }

       .card-front{
        transform:rotateY(0deg);
       }

       .card-back{
        transform:rotateY(180deg);
       }
    </style>
</head>
<body>
    <div id="container">
        <div id="card-frame">
                <div id="main-card">
                   <div class="card-face card-front">
                         <img src="./poke.jpg"  alt="front-image">
                   </div>
                   <div class="card-face card-back">
                        <img src="./misti.jpg" alt="back-image">
                   </div>
                </div>
        </div>
    </div>
</body>
</html>
