<!DOCTYPE html>

<style>
    body{
        background-color:#F9F9F9;
    }
    
    #outer-container{
        width:100%;
        height:97vh;
        background-color:#F9F9F9;
        display:flex;
        justify-content:start;
        align-items:start;
        flex-direction:column;
    }

    #head-div{
        width:55%;
        height:10vh;
        display:flex;
        flex-direction:row;
        justify-content:center;
        align-items:center;
    }

    h1{
        color:black;
        font-family:Arial, Helvetica, sans-serif;
        font-size:20pt;
        font-weight:540;
    }

    #inner-container{
        display:flex;
        width:100%;
        height:90vh;
        justify-content:center;
        align-items:start;
        flex-direction:row;
        background-color:#F9F9F9;
        gap:2em;
    }

    .cards{
        width:18%;
        height:60%;
        background-color:#F9F9F9;
        border:1.9px solid black;
        border-radius:5px;
        display:flex;
        justify-content:start;
        align-items:center;
        flex-direction:column;
        gap:1px;

    }

    .upper-card{
        position:relative;
        background-color:#F9F9F9;
        display:flex;
        flex-direction:column;
        justify-content:center;
        align-items:start;
        border-radius:5px;
        width:100%;
        height:50%;
        top:0.1%;
    }
    .upper-card h4{
        position:absolute;
        left:5%;
        border:1px solid black;
        top:0.01%;
        background-color:beige;
        color:black;
        padding:1%;
        width:20%;
        text-align:center;
        height:7%;
        font-size:10pt;
        font-family:Arial, Helvetica, sans-serif;
        font-weight:normal;
        border-radius:50px;
        z-index:2;
    }


    .upper-card img{
        top:-4.1%;
        width:100%;
        height:100%;
        z-index:1;
        position:absolute;
        object-fit:contain;
    }


   .lower-card{
        border:5px;
        position:relative;
        background-color:#F9F9F9;
        width:100%;
        height:50%;
        display:flex;
        flex-direction:column;
        text-align:center;
        justify-content:start;
        align-items:center;
        gap:2em;
   }

    .ratings{
    position:absolute;
    width:50%;
    background-color:#F9F9F9;
    height:10%;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:5px;
   }

   .ratings span{
    color:green;
    font-weight:10pt;
    font-family:Arial, Helvetica, sans-serif;
   }

   .lower-card h2{
    position:absolute;
    font-family:Arial, Helvetica, sans-serif;
    font-weight:bold;
    top:5%;
    font-size:17pt;
   }

   .lower-card p{
    position:absolute;
    top:20%;
    font-family:Arial, Helvetica, sans-serif;
    font-weight:normal;
    top:30%;
    font-size:10pt;
   }

   .lower-card h3{
    position:absolute;
    top:20%;
    font-family:Arial, Helvetica, sans-serif;
    font-weight:bold;
    top:45%;
    font-size:10pt;
   }
   
   .colors{
    position:absolute;
    width:50%;
    background-color:#F9F9F9;
    height:10%;
    display:flex;
    justify-content:center;
    align-items:center;
    top:50%;
    gap:5px;
   }

   .lower-card button{
    position:absolute;
    width:85%;
    height:20%;
    top:75%;
    background-color:#F9F9F9;
    color:black;
    border-radius:10px;
   }

    .lower-card button:hover{
    background-color:black;
    color:whitesmoke;
   }

   .lower-card button svg{
    fill:black;
   }

   .lower-card button:hover svg{
    fill:white;
   }
</style>
