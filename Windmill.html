<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z index</title>
    <style>

        #container{
            background-color:whitesmoke;
            width:100%;
            height:97vh;
            display:flex;
            flex-wrap:nowrap;
            justify-content:center;
            align-items:center;
        }
        .box{
            position:absolute;
        }

        #box1{
            width:100px;
            height:100px;
            font-size:80px;
            color:white;
            background-color:black;
            z-index:3;
            display:flex;
            justify-content:center;
            align-items:center;
            background-position:center;
            background-repeat:no-repeat;
            background-size:120px;
            border-radius:50%;
            animation-duration:0.1s;
            animation-iteration-count: infinite;
            animation-name:rotate;
        }

         #box2{
            height:200px;
            width:200px;
            background-color:wheat;
            z-index:2;
            animation-name:rotate;
            animation-duration:0.1s;
            animation-iteration-count: infinite;
            border-radius:10px;
        }
        #box3{
            width:90px;
            margin-top:200px;
            height:200px;
            background-color:purple;
            z-index:1;
            border-radius:10px;
        }

        @keyframes rotate{
            from{
                transform:rotate(0deg);
            }

            to{
                transform:rotate(360deg);
            }
        }


    </style>
</head>
<body>
    <div id="container">
       <div class="box" id="box1"><p>⚡</p></div>
       <div class="box" id="box2"></div>
       <div class="box" id="box3"></div>
    </div>
</body>
</html>
