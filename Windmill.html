<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z index</title>
    <style>

        #container{
            background-color:whitesmoke;
            width:100%;
            height:97vh;
            display:flex;
            flex-wrap:nowrap;
            justify-content:center;
            align-items:center;
        }
        .box{
            position:absolute;
        }

        #box1{
            width:100px;
            height:100px;
            font-size:80px;
            color:white;
            background-color:black;
            z-index:3;
            display:flex;
            justify-content:center;
            align-items:center;
            background-position:center;
            background-repeat:no-repeat;
            background-size:120px;
            border-radius:50%;
            animation-duration:0.1s;
            animation-iteration-count: infinite;
            animation-name:rotate;
        }

         #box2{
            height:200px;
            width:200px;
            background-color:wheat;
            z-index:2;
            border:2px solid black;
            animation-name:rotate;
            animation-duration:0.1s;
            animation-iteration-count: infinite;
            border-radius:10px;
        }
        #box3{
            width:90px;
            margin-top:200px;
            height:200px;
            box-shadow:5px 5px black;
            background-color:purple;
            z-index:1;
            border-radius:10px;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:end;
        }


        @keyframes rotate{
            from{
                transform:rotate(0deg);
            }

            to{
                transform:rotate(360deg);
            }
        }


    </style>
</head>
<body>
    <div id="container">
       <div class="box" id="box1">
        <svg xmlns="http://www.w3.org/2000/svg" width="50" height="50" fill="currentColor" class="bi bi-diamond-fill" viewBox="0 0 16 16">
        <path fill-rule="evenodd" d="M6.95.435c.58-.58 1.52-.58 2.1 0l6.515 6.516c.58.58.58 1.519 0 2.098L9.05 15.565c-.58.58-1.519.58-2.098 0L.435 9.05a1.48 1.48 0 0 1 0-2.098z"/>
        </svg>
       </div>
       <div class="box" id="box2"></div>
       <div class="box" id="box3"></div>
    </div>
</body>
</html>
