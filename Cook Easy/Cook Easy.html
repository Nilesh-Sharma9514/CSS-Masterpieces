<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cook Easy</title>
</head>
<style>
    body{
        background-color:#2664EB;
    }

    #container{
        width:100%;
        height:97vh;
        background-color:#2664EB;
        display:flex;
        justify-content:center;
        align-items:center;
    }

    #site{
        width:80%;
        height:90%;
        background-color:whitesmoke;
        border-radius:10px;
    }

    nav{
        display:flex;
        justify-content:center;
        align-items:center;
        width:100%;
        height:18%;
        border-radius:10px;
        background-color:whitesmoke;
    }

    #brand-logo-box{
        width:20%;
        height:100%;
        background-color:whitesmoke;
        border-radius:10px;
        border-top-right-radius: 0px;
        border-bottom-right-radius:0px;
        display:flex;
        justify-content:center;
        align-items:center;
        font-family:Arial, Helvetica, sans-serif;
        color:black;
        font-size:13pt;
        font-weight:bold;
        text-shadow:4px 0.01px white;
    }

    #brand-logo-box span{
        color:slateblue;
        font-weight:bold;
        text-shadow:4px 0.01px white;
    }

    #nav-links-box{
        width:80%;
        height:100%;
        background-color:red;
        border-radius:10px;
        border-top-left-radius:0px;
        border-bottom-left-radius:0px;
        display:flex;
        justify-content:end;
        align-items:center;
    }

    #nav-links{
        background-color:whitesmoke;
        width:80%;
        height:100%;
        display:flex;
        gap:20px;
        justify-content:end;
        align-items:center;
    }

    #nav-links a{
        font-size:15pt;
        text-decoration:none;
        color:slateblue;
        font-family:Arial, Helvetica, sans-serif;
    }

    #button-box{
        width:20%;
        height:100%;
        background-color:whitesmoke;
        display:flex;
        justify-content:center;
        align-items:center;
    }

    #button-box button{
        background-color:#2664EB;
        color:white;
        font-family:Arial, Helvetica, sans-serif;
        border-radius:10px;
        width:60%;
        height:40%;
        font-weight:bold;
        border:1px solid whitesmoke;
    }

    header{
        margin-top:5%;
        background-color:yellow;
        border-radius:5px;
        width:100%;
        height:72%;
        border-radius:10px;
        display:flex;
        justify-content:center;
        align-items:center;
    }

    #content{
        width:50%;
        height:100%;
        background-color:whitesmoke;
        display:flex;
        justify-content:center;
        align-items:center;
        flex-direction:column;
        gap:10px;
        text-indent:center;
        text-align:left;
    }

     #food-image{
        width:50%;
        height:100%;
        background-color:whitesmoke;
        display:flex;
        justify-content:center;
        align-items:center;
    }

    #content #p1{
        font-family:Arial, Helvetica, sans-serif;
        font-size:25pt;
        font-weight:bold;
        margin-right:25%;
        }

    #content #p2{
         font-family:Arial, Helvetica, sans-serif;
        font-size:20pt;
        margin-left:10%;
    }

    #content button{
        background-color:#2664EB;
        color:white;
        font-family:Arial, Helvetica, sans-serif;
        border-radius:10px;
        width:20%;
        height:10%;
        font-weight:bold;
        border:1px solid whitesmoke;   
        margin-right:60%;
    }
</style>
<body>
    <div id="container">
        <div id="site">
             <nav>
             <div id="brand-logo-box">
                <h1>Food<span>Lovers</span></h1>
             </div>
             <div id="nav-links-box">
                 <div id="nav-links">
                     <a href="">Home</a>
                     <a href="">Contact Us</a>
                     <a href="">Login</a>
                 </div>
             <div id="button-box">
                 <button>SignUp</button>
             </div>
             </div>
             </nav>
             <header>
                <div id="content">
                     <p id="p1">Learn. Cook. Share<br>Cooking Made Easy</p>
                     <p id="p2">Say good bye to long and frustating food blogs and recipe
                        videos. Access our recipe cards to prepare any dish in minutes.</p>
                     <button>Browse Dish</button>
                </div>
                <div id="food-image">
                    <img src="food.png" width="80%" height="80%">
                </div>
             </header>
        </div>
    </div>
</body>
</html>
